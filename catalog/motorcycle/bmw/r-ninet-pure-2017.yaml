notes:
  de: Die Einfahrkontrolle mit Ölwechsel ist zwischen 500 und 1.200 km fällig. Bremsflüssigkeit erstmals nach einem Jahr, dann alle zwei Jahre. Getriebeöl erstmals nach einem Jahr, dann alle zwei Jahre oder alle 40.000 km. Der BMW Service ist jährlich fällig.
  en: The running-in check with oil change is due between 500 and 1,200 km. Brake fluid first after one year, then every two years. Gearbox oil first after one year, then every two years or every 40,000 km. The BMW Service is due once a year.
