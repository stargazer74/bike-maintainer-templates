notes:
  de: Luft-/ölgekühlter Boxer mit zwei obenliegenden Nockenwellen je Zylinder (DOHC), R 1200 GS 2010-2012 und R 1200 GS Adventure ab 2010 mit gleichem Wartungsplan. Die Einfahrkontrolle mit Öl-, Ölfilter- und Hinterradantriebsölwechsel ist zwischen 500 und 1.200 km fällig. Der BMW Service ist jährlich bzw. alle 10.000 km fällig. Getriebeöl und Bremsflüssigkeit erstmals nach einem Jahr, dann alle zwei Jahre (Getriebeöl spätestens alle 40.000 km). Der Generatorriemen wird alle sechs Jahre bzw. 40.000 km ersetzt.
  en: Air/oil-cooled boxer with double overhead camshafts per cylinder (DOHC), R 1200 GS 2010-2012 and R 1200 GS Adventure from 2010 with the same schedule. The running-in check with engine oil, oil filter and final drive oil change is due between 500 and 1,200 km. BMW Service is due yearly or every 10,000 km. Gearbox oil and brake fluid first after one year, then every two years (gearbox oil at the latest every 40,000 km). The alternator belt is replaced every six years or 40,000 km.
