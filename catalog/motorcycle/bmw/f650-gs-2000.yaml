notes:
  de: Keine BMW-Anleitung für diese Baujahre online gefunden; die Werte stammen aus einer Händlerliste (km) und der Werkstatt-Checkliste von BMW USA (Meilen, Ölsorte, Ventilspiel, Bremsflüssigkeit jährlich). Erste Inspektion bei 1.000 km, dann Service bzw. Inspektion alle 10.000 km, mindestens jährlich. Ölmenge 2,3 l mit Filter laut Händlerliste.
  en: No BMW manual for these model years was found online; values come from a dealer list (km) and the BMW USA workshop checklist (miles, oil grade, valve clearance, brake fluid yearly). First inspection at 1,000 km, then service or inspection every 10,000 km, at least yearly. Oil quantity 2.3 l with filter according to the dealer list.
