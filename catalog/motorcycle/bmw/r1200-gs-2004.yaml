notes:
  de: Luft-/ölgekühlter Boxer vor dem DOHC-Motor ("Hexhead"), R 1200 GS ab 2004 und R 1200 GS Adventure ab 2006 mit gleichem Wartungsplan. Die Einfahrkontrolle ist zwischen 500 und 1.200 km fällig; BMW Service und BMW Inspection wechseln sich alle 10.000 km ab, dazu jährlich die Jahresinspektion. Das Öl im Hinterradantrieb ist laut Handbuch eine Lebensdauerfüllung und wird nicht planmäßig gewechselt. Mit Integral-ABS wird die Bremsflüssigkeit der Radkreise alle zwei Jahre, die des Steuerkreises alle vier Jahre gewechselt. Der Generatorriemen wird alle 60.000 km ersetzt.
  en: Air/oil-cooled boxer before the DOHC engine ("Hexhead"), R 1200 GS from 2004 and R 1200 GS Adventure from 2006 with the same schedule. The running-in check is due between 500 and 1,200 km; BMW Service and BMW Inspection alternate every 10,000 km, plus the annual inspection every year. The final drive oil is a lifetime fill according to the manual and is not changed on schedule. With Integral ABS the brake fluid of the wheel circuits is changed every two years, that of the control circuit every four years. The alternator belt is replaced every 60,000 km.
