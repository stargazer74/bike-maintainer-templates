notes:
  de: >-
    Gilt für die wassergekühlte R 1200 GS (Typ 0A01, ab Modelljahr 2017 Typ 0A51) und die R 1200 GS Adventure LC
    (Typ 0A02, ab 2014). Die Einfahrkontrolle ist zwischen 500 und 1.200 km fällig; laut Ausgabe 11.2017 gehört ein
    Ölwechsel dazu. Der BMW Service ist jährlich; Ölwechsel mit Filter jährlich oder alle 10.000 km, Öl im
    Hinterradantrieb alle zwei Jahre oder 20.000 km, je nachdem, was zuerst eintritt. Bei Geländebetrieb den
    Luftfilter zusätzlich jährlich bzw. alle 10.000 km prüfen. Bremsflüssigkeit erstmals nach einem Jahr, dann alle
    zwei Jahre. Die Anleitung 02.2013 nennt ca. 4,2 l Öl mit Filterwechsel, spätere Ausgaben max. 4,0 l.
  en: >-
    Covers the liquid-cooled R 1200 GS (type 0A01, type 0A51 from model year 2017) and the R 1200 GS Adventure LC
    (type 0A02, from 2014). The running-in check is due between 500 and 1,200 km; the 11.2017 edition states that it
    includes an oil change. The BMW Service is yearly; oil and filter change yearly or every 10,000 km, final drive
    oil every two years or 20,000 km, whichever comes first. For off-road use, also check the air filter yearly or
    every 10,000 km. Brake fluid first after one year, then every two years. The 02.2013 manual gives approx. 4.2 l of
    oil with filter change, later editions max. 4.0 l.
