id: bmw-f650-gs-2004
type: MOTORCYCLE
make: BMW
model: F 650 GS
aliases: [F650GS, F 650GS, F 650 GS Dakar, F650GS Dakar, F 650 GS Dual Spark]
years: { from: 2004, to: 2004 }
market: EU
sources:
  - id: manual
    kind: MANUFACTURER
    title: BMW Motorrad Maintenance Instructions F 650 GS / F 650 GS Dakar, edition 09/2003 (F_0175_ST_1003_F650GS_01, English)
    url: https://manuals.bmw-motorrad.com/manuals/BA-Extern/IN/BA-INTERNET-COM/PDF/F_0175_ST_1003_F650GS_01.pdf
    locator: Maintenance work S. 3; Adjusting the chain S. 31; Fuel and lubricants S. 68, 70; Electrical system S. 71
    retrieved: 2026-11-18
  - id: hornig
    kind: DEALER
    title: Hornig, Maintenance intervals / Service for BMW F 650, CS, GS, ST & Dakar (task lists by service)
    url: https://motorcycleparts-hornig.com/BMW-F-650-CS-GS-ST-Dakar/Maintenance-interval-service/
    locator: Running-in Check 1.000 km; 10.000 km service (30.000/50.000 km); 20.000 km service (40.000/60.000 km)
    retrieved: 2026-11-18
tasks:
  - key: engine-oil
    intervalKm: 10000
    firstDueKm: 1000
    sources: [hornig]
    details:
      - { label: oil, value: "HD-Öl API SF, SG oder SH (oder CCMC G4/G5), SAE-Klasse nach Außentemperatur, kein synthetisches Öl", quantity: "2,3 l mit Filterwechsel", sources: [manual] }
  - key: oil-filter
    intervalKm: 10000
    firstDueKm: 1000
    sources: [hornig]
  - key: valve-clearance
    intervalKm: 10000
    sources: [hornig]
  - key: spark-plugs
    intervalKm: 20000
    firstDueKm: 10000
    sources: [hornig]
    details:
      - { label: spark-plug, value: NGK DR8 EB (zwei Kerzen), sources: [manual] }
      - { label: electrode-gap, value: "0,6–0,7 mm", sources: [manual] }
  - key: air-filter
    intervalKm: 20000
    sources: [hornig]
  - key: fuel-filter
    intervalKm: 40000
    sources: [hornig]
  - key: drive-chain-check
    intervalKm: 10000
    firstDueKm: 1000
    sources: [hornig]
    details:
      - { label: chain-slack, value: "35–45 mm (Dakar: 40–50 mm), unbelastet", sources: [manual] }
  - key: brake-pads-check
    intervalKm: 10000
    sources: [hornig]
  - key: steering-head-bearing
    intervalKm: 10000
    sources: [hornig]
  - key: brake-fluid
    intervalMonths: 12
    sources: [manual]
    details:
      - { label: fluid, value: DOT 4, sources: [manual] }
  - key: inspection
    intervalKm: 10000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [manual]
notes:
  de: BMW-Inspektion nach 1.000 km, danach im Wechsel BMW Service (10.000, 30.000 km …) und BMW Inspektion (20.000, 40.000 km …), zeitabhängige Arbeiten wie der Bremsflüssigkeitswechsel mindestens jährlich (Jahresinspektion). Die Einzelintervalle stammen aus einer Händlerliste, nicht aus der BMW-Anleitung. Gilt für die Doppelzündungs-Modelle; Kettendurchhang beim Dakar größer.
  en: BMW inspection after 1,000 km, then alternating BMW Service (10,000, 30,000 km …) and BMW Inspection (20,000, 40,000 km …); time-dependent work such as the brake fluid change at least once a year (annual inspection). The item intervals come from a dealer list, not from the BMW instructions. Applies to the dual-spark models; the Dakar has a larger chain slack.
