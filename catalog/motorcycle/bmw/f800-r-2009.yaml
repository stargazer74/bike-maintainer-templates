notes:
  de: Die Betriebsanleitungen enthalten keinen Wartungsplan mit Kilometerintervallen, nur die Einfahrkontrolle zwischen 500 und 1.200 km und den BMW Service einmal jährlich (bei hoher Laufleistung mit Höchst-Kilometerstand). Kilometerintervalle und Einzelarbeiten (Ölwechsel auch bei der Einfahrkontrolle, Ventilspiel, Zündkerzen, Luftfilter, Kettenprüfung) stammen vom Händler Hornig. Kette mindestens alle 1.000 km schmieren, nach Nässe oder Schmutz früher. Die Auflage 2009 nennt als Motoröl noch SAE 15W-40 bzw. 10W-40 mineralisch (API SF bis SH), die Auflage 2012 SAE 15W-50.
  en: The rider's manuals contain no maintenance schedule with mileage intervals, only the running-in check between 500 and 1,200 km and the BMW service once a year (with a maximum odometer reading for high-mileage riders). Mileage intervals and individual jobs (oil change also at the running-in check, valve clearance, spark plugs, air filter, chain check) come from the dealer Hornig. Lubricate the chain at least every 1,000 km, sooner after rain or dirt. The 2009 edition still lists SAE 15W-40 or 10W-40 mineral oil (API SF to SH), the 2012 edition SAE 15W-50.
