notes:
  de: Die Einfahrkontrolle ist zwischen 500 und 1.200 km fällig; der Wartungsplan sieht dort keinen Ölwechsel vor. Der Standard-BMW-Service ist jährlich, Öl und Ölfilter jährlich oder alle 10.000 km (was zuerst eintritt). Bremsflüssigkeit erstmals nach einem Jahr, dann alle zwei Jahre. Zahnriemen und hinterer Ruckdämpfer werden alle 40.000 km ersetzt, Riemenrad, Riemenritzel und Ritzel-Ruckdämpfer alle 40.000 km geprüft; Zahnriemen und Riemenspannung werden beim jährlichen Service geprüft.
  en: The running-in check is due between 500 and 1,200 km; the schedule lists no oil change there. The standard BMW service is yearly, oil and oil filter yearly or every 10,000 km (whichever comes first). Brake fluid first after one year, then every two years. The drive belt and rear cush drive are replaced every 40,000 km, the belt pulley, belt sprocket and sprocket cush drive are checked every 40,000 km; belt condition and tension are checked at the yearly service.
