notes:
  de: Die Einfahrkontrolle ist zwischen 500 und 1.200 km fällig; sie umfasst Motoröl mit Filter, Öl im Winkelgetriebe und eine Prüfung der Synchronisation. Bremsflüssigkeit erstmals nach einem Jahr, dann alle zwei Jahre. Getriebeöl erstmals nach einem Jahr, dann alle zwei Jahre oder alle 40.000 km. Der BMW Service ist jährlich fällig. Der Riemen des Generators wird laut Wartungsplan alle 40.000 km oder sechs Jahre ersetzt (im Katalog noch ohne eigene Aufgabe). Die Ausgaben 2013 und 2014 der Anleitung nennen nur Einfahrkontrolle und jährlichen Service, den vollständigen Wartungsplan erst die Ausgabe 2015 für denselben Typ.
  en: The running-in check is due between 500 and 1,200 km; it covers engine oil with filter, final drive oil and a throttle synchronisation check. Brake fluid first after one year, then every two years. Gearbox oil first after one year, then every two years or every 40,000 km. The BMW Service is due once a year. The schedule also replaces the alternator belt every 40,000 km or six years (no catalog task for it yet). The 2013 and 2014 manual editions only state the running-in check and the yearly service; the full schedule is in the 2015 edition for the same type.
