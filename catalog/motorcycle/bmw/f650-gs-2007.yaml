notes:
  de: Die BMW-Einfahrkontrolle ist zwischen 500 und 1.200 km fällig, danach der BMW Service einmal im Jahr; Vielfahrer kommen früher, wenn der vom Händler eingetragene Kilometerstand erreicht ist. Die 10.000 km und die Einzelintervalle stammen aus einer Händlerliste, nicht aus der BMW-Anleitung. Kettendurchhang beim Dakar größer.
  en: The BMW running-in check is due between 500 and 1,200 km, then the BMW Service once a year; high-mileage riders come earlier when the odometer reading entered by the dealer is reached. The 10,000 km and the item intervals come from a dealer list, not from the BMW instructions. The Dakar has a larger chain slack.
