# yaml-language-server: $schema=../../../schema/template.schema.json
id: kawasaki-z1000-2015
type: MOTORCYCLE
make: Kawasaki
model: Z1000
aliases: [Z 1000, ZR1000, ZR1000F, ZR1000G, Z1000 ABS]
years: { from: 2015, to: 2016 }
market: EU
sources:
  - id: om2015
    kind: MANUFACTURER
    title: Kawasaki Z1000 ABS (ZR1000FFF) Owner's Manual 2015, EU edition (99976-1901, English), Kawasaki online viewer
    url: https://pws.ktivs.net/dispeBook?file=99976-1901&lang_code=EN
    locator: Periodic Maintenance p. 93–96; General Information p. 22 (spark plug, oil, coolant capacity) and p. 23 (brake fluid); oil capacity p. 100; coolant p. 103; chain slack p. 110
    retrieved: 2026-11-18
  - id: om2016
    kind: MANUFACTURER
    title: Kawasaki Z1000 ABS (ZR1000FGF) Owner's Manual 2016, EU edition (99976-1935, English), Kawasaki online viewer
    url: https://pws.ktivs.net/dispeBook?file=99976-1935&lang_code=EN
    locator: Periodic Maintenance p. 93–96
    retrieved: 2026-11-18
tasks:
  - key: engine-oil
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2015, om2016]
    details:
      - { label: oil, value: "SAE 10W-40, API SG/SH/SJ/SL/SM, JASO MA/MA1/MA2", quantity: "3,8 l mit Filterwechsel", sources: [om2015] }
  - key: oil-filter
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2015, om2016]
  - key: air-filter
    intervalKm: 18000
    sources: [om2015, om2016]
  - key: spark-plugs
    intervalKm: 12000
    sources: [om2015, om2016]
    details:
      - { label: spark-plug, value: NGK CR9EIA-9, sources: [om2015] }
      - { label: electrode-gap, value: "0,8–0,9 mm", sources: [om2015] }
  - key: valve-clearance
    intervalKm: 42000
    sources: [om2015, om2016]
  - key: throttle-body-sync
    intervalKm: 12000
    sources: [om2015, om2016]
  - key: coolant
    intervalKm: 36000
    intervalMonths: 36
    sources: [om2015, om2016]
    details:
      - { label: coolant, value: "Permanent-Frostschutz (Ethylenglykol, für Alu-Motoren), ab Werk 50 %", quantity: "2,9 l", sources: [om2015] }
  - key: brake-fluid
    intervalKm: 24000
    intervalMonths: 24
    sources: [om2015, om2016]
    details:
      - { label: fluid, value: DOT 4, sources: [om2015] }
  - key: drive-chain-lube
    intervalKm: 600
    sources: [om2015, om2016]
  - key: drive-chain-check
    intervalKm: 1000
    sources: [om2015, om2016]
    details:
      - { label: chain-slack, value: "20–30 mm", sources: [om2015] }
  - key: brake-pads-check
    intervalKm: 6000
    sources: [om2015, om2016]
  - key: steering-head-bearing
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2015, om2016]
  - key: inspection
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2015, om2016]
notes:
  de: >-
    Plan aus den EU-Handbüchern 2015 und 2016 (Tabelle gleich). Ventilspiel alle 42.000 km (die US-Ausgabe nennt
    24.000 km). Kette: Schmierzustand alle 600 km, Durchhang alle 1.000 km prüfen. Lenkkopflager zusätzlich alle
    24.000 km bzw. 2 Jahre schmieren, Kraftstoffschläuche alle 5 Jahre, Bremsschläuche alle 4 Jahre ersetzen.
    Ventilspiel-Sollwerte stehen nicht im Fahrerhandbuch.
  en: >-
    Schedule from the EU owner's manuals 2015 and 2016 (same chart). Valve clearance every 42,000 km (the US edition
    says 24,000 km). Chain: check lubrication every 600 km and slack every 1,000 km. Also grease the steering stem
    bearings every 24,000 km or 2 years, replace fuel hoses every 5 years and brake hoses every 4 years. Valve
    clearance specs are not in the owner's manual.
