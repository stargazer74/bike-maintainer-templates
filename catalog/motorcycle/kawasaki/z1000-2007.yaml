# yaml-language-server: $schema=../../../schema/template.schema.json
id: kawasaki-z1000-2007
type: MOTORCYCLE
make: Kawasaki
model: Z1000
aliases: [Z 1000, ZR1000, ZR1000B, ZR1000C, Z1000 ABS]
years: { from: 2007, to: 2009 }
market: EU
sources:
  - id: om2007
    kind: MANUFACTURER
    title: Kawasaki Z1000 / Z1000 ABS Owner's Manual, EU edition (99976-1305, English; © 2006, printed Mar. 2007), Kawasaki online viewer
    url: https://pws.ktivs.net/dispeBook?file=99976-1305&lang_code=EN
    locator: Periodic Maintenance Chart p. 82–90; Specifications p. 11 (spark plug, oil, coolant capacity); oil p. 96; spark plug gap p. 105; chain slack p. 116; brake fluid p. 123
    retrieved: 2026-11-18
  - id: om2008
    kind: MANUFACTURER
    title: Kawasaki Z1000 / Z1000 ABS Owner's Manual, EU edition (99976-1411, English; © 2007), Kawasaki online viewer
    url: https://pws.ktivs.net/dispeBook?file=99976-1411&lang_code=EN
    locator: Periodic Maintenance Chart p. 82–90
    retrieved: 2026-11-18
  - id: om2009
    kind: MANUFACTURER
    title: Kawasaki Z1000 / Z1000 ABS Owner's Manual, EU edition (99976-1471, English; © 2008), Kawasaki online viewer
    url: https://pws.ktivs.net/dispeBook?file=99976-1471&lang_code=EN
    locator: Periodic Maintenance Chart p. 82–92
    retrieved: 2026-11-18
tasks:
  - key: engine-oil
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2007, om2008, om2009]
    details:
      - { label: oil, value: "SAE 10W-40, API SE/SF/SG oder API SH/SJ/SL mit JASO MA", quantity: "3,3 l mit Filterwechsel", sources: [om2007] }
  - key: oil-filter
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2007, om2008, om2009]
  - key: air-filter
    intervalKm: 36000
    sources: [om2007, om2008, om2009]
  - key: spark-plugs
    intervalKm: 12000
    sources: [om2007, om2008, om2009]
    details:
      - { label: spark-plug, value: NGK CR9EIA-9, sources: [om2007] }
      - { label: electrode-gap, value: "0,8–0,9 mm", sources: [om2007] }
  - key: valve-clearance
    intervalKm: 42000
    sources: [om2007, om2008, om2009]
  - key: throttle-body-sync
    intervalKm: 12000
    sources: [om2007, om2008, om2009]
  - key: coolant
    intervalKm: 36000
    intervalMonths: 36
    sources: [om2007, om2008, om2009]
    details:
      - { label: coolant, value: "Permanent-Frostschutz (Ethylenglykol), ab Werk 50 %", quantity: "2,9 l", sources: [om2007] }
  - key: brake-fluid
    intervalKm: 24000
    intervalMonths: 24
    sources: [om2007, om2008, om2009]
    details:
      - { label: fluid, value: DOT 4, sources: [om2007] }
  - key: drive-chain-lube
    intervalKm: 600
    sources: [om2007, om2008, om2009]
  - key: drive-chain-check
    intervalKm: 1000
    sources: [om2007, om2008, om2009]
    details:
      - { label: chain-slack, value: "25–30 mm", sources: [om2007] }
  - key: brake-pads-check
    intervalKm: 6000
    sources: [om2007, om2008, om2009]
  - key: steering-head-bearing
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2007, om2008, om2009]
  - key: inspection
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2007, om2008, om2009]
notes:
  de: >-
    Plan aus den EU-Handbüchern 2007, 2008 und 2009 (Tabelle gleich). Luftfilter bei 18.000 km reinigen, bei 36.000 km
    ersetzen. Kette: Schmierzustand alle 600 km, Durchhang alle 1.000 km prüfen. Lenkkopflager alle 24.000 km bzw.
    2 Jahre schmieren; Kraftstoff- und Bremsschläuche alle 4 Jahre, Kühlerschläuche alle 3 Jahre ersetzen.
    Ventilspiel-Sollwerte stehen nicht im Fahrerhandbuch.
  en: >-
    Schedule from the EU owner's manuals 2007, 2008 and 2009 (same chart). Clean the air filter at 18,000 km and
    replace it at 36,000 km. Chain: check lubrication every 600 km and slack every 1,000 km. Grease the steering stem
    bearings every 24,000 km or 2 years; replace fuel and brake hoses every 4 years and radiator hoses every 3 years.
    Valve clearance specs are not in the owner's manual.
