id: kawasaki-er-6f-2012
type: MOTORCYCLE
make: Kawasaki
model: ER-6f
aliases: [ER6f, ER-6 f, ER 6f, ER-6f ABS, EX650E, EX650F]
years: { from: 2012, to: 2016 }
market: EU
sources:
  - id: om-2013
    kind: MANUFACTURER
    title: Kawasaki ER-6f / ER-6f ABS (EX650EDF, 2013) Owner's Manual, EU edition, English (99976-1744), official Kawasaki manual viewer (KTIVS)
    url: https://pws.ktivs.net/dispeBook?file=99976-1744&lang_code=EN
    locator: Periodic Maintenance Chart p. 78–87
    retrieved: 2026-11-18
  - id: om-2014
    kind: MANUFACTURER
    title: Kawasaki ER-6f / ER-6f ABS (EX650EEF, 2014) Owner's Manual, EU edition, English (99976-1815), official Kawasaki manual viewer (KTIVS)
    url: https://pws.ktivs.net/dispeBook?file=99976-1815&lang_code=EN
    locator: Periodic Maintenance Chart p. 81–90; Engine Oil p. 95–96; Spark Plugs p. 105; Drive Chain Slack p. 117; Brake Fluid p. 125
    retrieved: 2026-11-18
  - id: sm-2012
    kind: MANUFACTURER
    title: Kawasaki Ninja 650 / ER-6f (EX650ECF/FCF) Service Manual, 1st Edition (2) Sep. 2011 (99924-1454-01), copy hosted by motorcycle workshop moto4.ru
    url: https://www.moto4.ru/downloads/Kawasaki%20ER-6f%202012%20EX650ECF-FCF%2099924-1454-01.pdf
    locator: Periodic Maintenance Chart p. 2-3–2-5 (valve clearance "other than US, CA"); Specifications p. 2-12–2-13
    retrieved: 2026-11-18
  - id: us-2016
    kind: MANUFACTURER
    title: Kawasaki Ninja 650 / Ninja 650 ABS (EX650E/F, 2016) Owner's Manual, US edition (km and mile chart), English (99987-1888), official Kawasaki manual viewer (KTIVS)
    url: https://pws.ktivs.net/dispeBook?file=99987-1888&lang_code=EN
    locator: Periodic Maintenance Chart p. 90–101 (US valve clearance interval not used)
    retrieved: 2026-11-18
tasks:
  - key: engine-oil
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om-2013, om-2014, sm-2012, us-2016]
    details:
      - { label: oil, value: "SAE 10W-40, API SG/SH/SJ/SL/SM, JASO MA/MA1/MA2", quantity: "1,8 l mit Filterwechsel", sources: [om-2014] }
  - key: oil-filter
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om-2013, om-2014, sm-2012, us-2016]
  - key: air-filter
    intervalKm: 18000
    sources: [om-2013, om-2014, sm-2012, us-2016]
  - key: spark-plugs
    intervalKm: 12000
    sources: [om-2013, om-2014, sm-2012, us-2016]
    details:
      - { label: spark-plug, value: "NGK CR9EIA-9", sources: [om-2014] }
      - { label: electrode-gap, value: "0,8–0,9 mm", sources: [om-2014] }
  - key: valve-clearance
    intervalKm: 42000
    sources: [om-2013, om-2014, sm-2012]
    details:
      - { label: clearance-intake, value: "0,15–0,21 mm", sources: [sm-2012] }
      - { label: clearance-exhaust, value: "0,22–0,31 mm", sources: [sm-2012] }
  - key: coolant
    intervalKm: 36000
    intervalMonths: 36
    sources: [om-2013, om-2014, sm-2012, us-2016]
    details:
      - { label: coolant, value: "Dauerfrostschutz, 1:1 mit weichem Wasser", quantity: "1,2 l", sources: [sm-2012] }
  - key: brake-fluid
    intervalKm: 24000
    intervalMonths: 24
    sources: [om-2013, om-2014, sm-2012, us-2016]
    details:
      - { label: fluid, value: "DOT 4", sources: [om-2014] }
  - key: drive-chain-lube
    intervalKm: 600
    sources: [om-2013, om-2014, sm-2012, us-2016]
  - key: drive-chain-check
    intervalKm: 1000
    sources: [om-2013, om-2014, sm-2012, us-2016]
    details:
      - { label: chain-slack, value: "25–35 mm", sources: [om-2014] }
  - key: brake-pads-check
    intervalKm: 6000
    sources: [om-2013, om-2014, sm-2012, us-2016]
  - key: steering-head-bearing
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om-2013, om-2014, sm-2012, us-2016]
  - key: throttle-body-sync
    intervalKm: 12000
    sources: [om-2013, om-2014, sm-2012, us-2016]
  - key: inspection
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om-2013, om-2014, sm-2012, us-2016]
notes:
  de: "Ventilspiel alle 42.000 km (EU; US-Ausgaben nennen 24.000 km). Bremsbeläge ab 6.000 km alle 6.000 km prüfen. Lenkkopflager: Spiel jährlich bzw. alle 12.000 km prüfen, Lager alle 2 Jahre bzw. 24.000 km schmieren. Bremsschläuche und Kraftstoffschläuche nach 4 bzw. 5 Jahren ersetzen."
  en: "Valve clearance every 42,000 km (EU; US editions state 24,000 km). Check brake pads every 6,000 km from 6,000 km. Steering: check play yearly or every 12,000 km, lubricate the stem bearings every 2 years or 24,000 km. Replace brake hoses after 4 years and fuel hoses after 5 years."
