# yaml-language-server: $schema=../../../schema/template.schema.json
id: kawasaki-er-6f-2006
type: MOTORCYCLE
make: Kawasaki
model: ER-6f
aliases: [ER6f, ER-6 f, ER 6f, ER-6f ABS, Ninja 650R, EX650A, EX650B]
years: { from: 2006, to: 2006 }
market: EU
sources:
  - id: om-2006
    kind: MANUFACTURER
    title: Kawasaki ER-6f / ER-6f ABS (2006) Owner's Manual, EU edition, multilingual (99976-1250), official Kawasaki manual viewer (KTIVS)
    url: https://pws.ktivs.net/dispeBook?file=99976-1250&lang_code=EN
    locator: Periodic Maintenance Chart p. 63–71
    retrieved: 2026-11-18
  - id: sm-2006
    kind: MANUFACTURER
    title: Kawasaki ER-6f / ER-6f ABS / Ninja 650R (EX650A6F/B6F) Service Manual, First Edition (1) Nov. 2005 (99924-1361-01), copy hosted by motorcycle workshop moto4.ru
    url: https://www.moto4.ru/downloads/ER-6f%20650R%20Ninja%20Service%20Manual.pdf
    locator: Periodic Maintenance Chart p. 2-3–2-5; Specifications p. 2-11–2-12; General Specifications p. 1-10
    retrieved: 2026-11-18
tasks:
  - key: engine-oil
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om-2006]
    details:
      - { label: oil, value: "SAE 10W-40, API SE/SF/SG oder API SH/SJ/SL mit JASO MA", quantity: "1,9 l mit Filterwechsel", sources: [sm-2006] }
  - key: oil-filter
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om-2006]
  - key: air-filter
    intervalMonths: 24
    sources: [om-2006]
  - key: spark-plugs
    intervalKm: 12000
    sources: [om-2006]
    details:
      - { label: spark-plug, value: "NGK CR9EIA-9", sources: [sm-2006] }
      - { label: electrode-gap, value: "0,8–0,9 mm", sources: [sm-2006] }
  - key: valve-clearance
    intervalKm: 42000
    sources: [om-2006, sm-2006]
    details:
      - { label: clearance-intake, value: "0,15–0,21 mm", sources: [sm-2006] }
      - { label: clearance-exhaust, value: "0,22–0,31 mm", sources: [sm-2006] }
  - key: coolant
    intervalKm: 36000
    intervalMonths: 36
    sources: [om-2006]
    details:
      - { label: coolant, value: "Dauerfrostschutz, 1:1 mit weichem Wasser", quantity: "1,2 l", sources: [sm-2006] }
  - key: brake-fluid
    intervalKm: 24000
    intervalMonths: 24
    sources: [om-2006]
    details:
      - { label: fluid, value: "DOT 4", sources: [sm-2006] }
  - key: drive-chain-lube
    intervalKm: 600
    sources: [om-2006]
  - key: drive-chain-check
    intervalKm: 1000
    sources: [om-2006]
    details:
      - { label: chain-slack, value: "30–40 mm", sources: [sm-2006] }
  - key: brake-pads-check
    intervalKm: 6000
    sources: [om-2006]
  - key: steering-head-bearing
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om-2006]
  - key: throttle-body-sync
    intervalKm: 12000
    sources: [om-2006]
  - key: inspection
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om-2006]
notes:
  de: "Luftfiltereinsatz alle 12.000 km reinigen und alle 2 Jahre ersetzen (kein km-Intervall). Ventilspiel alle 42.000 km (EU). Bremsbeläge ab 6.000 km alle 6.000 km prüfen. Lenkkopflager alle 2 Jahre bzw. 24.000 km schmieren. Brems- und Kraftstoffschläuche alle 4 Jahre ersetzen."
  en: "Clean the air filter element every 12,000 km and replace it every 2 years (no km interval). Valve clearance every 42,000 km (EU). Check brake pads every 6,000 km from 6,000 km. Lubricate the steering stem bearings every 2 years or 24,000 km. Replace brake and fuel hoses every 4 years."
