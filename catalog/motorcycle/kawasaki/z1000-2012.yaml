# yaml-language-server: $schema=../../../schema/template.schema.json
id: kawasaki-z1000-2012
type: MOTORCYCLE
make: Kawasaki
model: Z1000
aliases: [Z 1000, ZR1000, ZR1000D, Z1000 ABS]
years: { from: 2012, to: 2012 }
market: EU
sources:
  - id: om2012
    kind: MANUFACTURER
    title: Kawasaki Z1000 ABS (ZR1000DCF) Owner's Manual 2012, US edition (99987-1708, English; chart in km), Kawasaki online viewer
    url: https://pws.ktivs.net/dispeBook?file=99987-1708&lang_code=EN
    locator: Periodic Maintenance Chart p. 80–90; Specifications p. 8 (spark plug, oil, coolant capacity); oil capacity p. 96; spark plug gap p. 103; chain slack p. 119; brake fluid p. 126
    retrieved: 2026-11-18
tasks:
  - key: engine-oil
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2012]
    details:
      - { label: oil, value: "SAE 10W-40, API SG/SH/SJ/SL/SM, JASO MA/MA1/MA2", quantity: "3,8 l mit Filterwechsel", sources: [om2012] }
  - key: oil-filter
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2012]
  - key: air-filter
    intervalKm: 18000
    sources: [om2012]
  - key: spark-plugs
    intervalKm: 12000
    sources: [om2012]
    details:
      - { label: spark-plug, value: NGK CR9EIA-9, sources: [om2012] }
      - { label: electrode-gap, value: "0,8–0,9 mm", sources: [om2012] }
  - key: valve-clearance
    intervalKm: 24000
    sources: [om2012]
  - key: throttle-body-sync
    intervalKm: 12000
    sources: [om2012]
  - key: coolant
    intervalKm: 36000
    intervalMonths: 36
    sources: [om2012]
  - key: brake-fluid
    intervalKm: 24000
    intervalMonths: 24
    sources: [om2012]
    details:
      - { label: fluid, value: DOT 4, sources: [om2012] }
  - key: drive-chain-lube
    intervalKm: 600
    sources: [om2012]
  - key: drive-chain-check
    intervalKm: 1000
    sources: [om2012]
    details:
      - { label: chain-slack, value: "20–30 mm", sources: [om2012] }
  - key: brake-pads-check
    intervalKm: 6000
    sources: [om2012]
  - key: steering-head-bearing
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2012]
  - key: inspection
    intervalKm: 12000
    intervalMonths: 12
    firstDueKm: 1000
    sources: [om2012]
notes:
  de: >-
    Plan aus dem US-Handbuch 2012 (Tabelle in km); ein EU-Handbuch für 2010–2012 war online nicht auffindbar. Achtung:
    Die US-Ausgabe nennt für das Ventilspiel 24.000 km, die EU-Ausgabe 2013 desselben Modells 42.000 km. Kette:
    Schmierzustand alle 600 km, Durchhang alle 1.000 km prüfen. Lenkkopflager alle 24.000 km bzw. 2 Jahre schmieren;
    Kraftstoffschläuche alle 5 Jahre, Kühlerschläuche alle 3 Jahre, Bremsschläuche alle 4 Jahre ersetzen.
  en: >-
    Schedule from the 2012 US owner's manual (chart in km); no EU manual for 2010–2012 was found online. Note: the US
    edition gives 24,000 km for the valve clearance, the 2013 EU edition of the same model 42,000 km. Chain: check
    lubrication every 600 km and slack every 1,000 km. Grease the steering stem bearings every 24,000 km or 2 years;
    replace fuel hoses every 5 years, radiator hoses every 3 years and brake hoses every 4 years.
