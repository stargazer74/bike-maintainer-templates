# Weekly check of all source links. Dead links (404/410, unknown host) become one issue; it never blocks anything.
name: Link check

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check source links
        id: check
        continue-on-error: true
        run: ./mvnw -B -ntp test -Dgroups=links -Dtests.excluded= -Dtest=LinkCheckTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Summary
        if: always()
        run: |
          if [ -s target/link-check.md ]; then cat target/link-check.md >> "$GITHUB_STEP_SUMMARY"; else echo "Alle Links erreichbar." >> "$GITHUB_STEP_SUMMARY"; fi

      # One open issue at a time: a new finding is added as a comment instead of opening another issue.
      - name: Report dead links
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Tote Quellenlinks im Katalog
        run: |
          {
            echo "Der wöchentliche Linkcheck hat tote Quellenlinks gefunden ([Lauf](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo
            cat target/link-check.md 2>/dev/null || echo "Kein Bericht – siehe Lauf."
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
