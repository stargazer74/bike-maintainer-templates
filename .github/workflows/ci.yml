# Checks the catalog (schema and rules, see README "Prüfregeln") and builds the Maven artifact on every PR and push.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check catalog and build artifact
        run: ./mvnw -B -ntp verify
